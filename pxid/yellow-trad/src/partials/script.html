<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(function(){ document.body.classList.add('hero-in'); });
  function addReveal(sel, stagger){
    document.querySelectorAll(sel).forEach(function(el, i){
      el.classList.add('reveal');
      if(stagger) el.style.setProperty('--i', i % stagger);
    });
  }
  addReveal('.steps .step', 3);
  addReveal('.cards .card', 4);
  addReveal('.case-carousel .case', 3);
  addReveal('.plat .pcard', 3);
  addReveal('.qstats .q', 3);
  addReveal('.partners .grid .b', 6);
  addReveal('.faq details', 2);
  addReveal('.sec-head');
  addReveal('.about .lead2');
  addReveal('.about p.body');
  addReveal('.small .grid > div');
  if(!('IntersectionObserver' in window) || reduce){
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); });
  } else {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold:.12, rootMargin:'0px 0px -8% 0px' });
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
  }
  function countStrip(){
    document.querySelectorAll('.strip .s b').forEach(function(b){
      var html = b.innerHTML;
      var m = html.match(/^([\d,]+)/);
      if(!m) return;
      var target = parseFloat(m[0].replace(/,/g,''));
      var prefix = html.slice(0, html.indexOf(m[0]));
      var suffix = html.slice(html.indexOf(m[0]) + m[0].length);
      var dur = 1500, t0 = performance.now();
      (function tick(now){
        var p = Math.min(1, (now - t0) / dur);
        var e = 1 - Math.pow(1 - p, 3);
        var cur = Math.round(target * e);
        b.innerHTML = prefix + cur.toLocaleString('en-US') + suffix;
        if(p < 1) requestAnimationFrame(tick);
      })(performance.now());
    });
  }
  var strip = document.querySelector('.strip');
  if(strip){
    if(!('IntersectionObserver' in window) || reduce){ countStrip(); }
    else {
      var cio = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting){ countStrip(); cio.disconnect(); } });
      }, { threshold:.3 });
      cio.observe(strip);
    }
  }
  var header = document.querySelector('header');
  var top = document.querySelector('.to-top');
  function onScroll(){
    var y = window.pageYOffset || document.documentElement.scrollTop;
    if(header) header.classList.toggle('scrolled', y > 20);
    if(top) top.classList.toggle('show', y > 500);
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();

  /* ===== Home Case Carousel ===== */
  (function initHomeCaseCarousel(){
    var track = document.getElementById('homeCaseTrack');
    if(!track) return;
    var prevBtn = document.getElementById('homeCasePrev');
    var nextBtn = document.getElementById('homeCaseNext');
    var dotsWrap = document.getElementById('homeCaseDots');
    var cases = track.querySelectorAll('.case');
    var total = cases.length;
    var perPage, current = 0, maxPage, dots;

    function recalcPerPage(){
      var caseW = getCaseWidth();
      var gap = 22;
      perPage = Math.max(1, Math.floor((track.clientWidth + gap) / (caseW + gap)));
      maxPage = Math.max(0, total - perPage);
      // Rebuild dots
      if(dotsWrap){
        dotsWrap.innerHTML = '';
        for(var i = 0; i <= maxPage; i++){
          var dot = document.createElement('button');
          dot.className = 'case-dot' + (i === current ? ' active' : '');
          dot.setAttribute('aria-label', '第' + (i+1) + '页');
          dot.addEventListener('click', (function(p){ return function(){ goTo(p); }; })(i));
          dotsWrap.appendChild(dot);
        }
        dots = dotsWrap.querySelectorAll('.case-dot');
      }
    }

    function getCaseWidth(){
      var c = cases[0];
      if(!c) return 0;
      return c.getBoundingClientRect().width;
    }

    function goTo(page){
      if(page < 0) page = 0;
      if(page > maxPage) page = maxPage;
      current = page;
      var caseW = getCaseWidth();
      var gap = 22;
      var scrollX = page * (caseW + gap);
      track.scrollTo({ left: scrollX });
      updateUI();
    }

    function updateUI(){
      if(dots) dots.forEach(function(d, i){ d.classList.toggle('active', i === current); });
      if(prevBtn) prevBtn.disabled = current === 0;
      if(nextBtn) nextBtn.disabled = current >= maxPage;
    }

    function syncFromScroll(){
      var caseW = getCaseWidth();
      var gap = 22;
      var scrollX = track.scrollLeft;
      var page = Math.round(scrollX / (caseW + gap));
      if(page !== current && page >= 0 && page <= maxPage){
        current = page;
        updateUI();
      }
    }

    if(prevBtn) prevBtn.addEventListener('click', function(){ goTo(current - 1); });
    if(nextBtn) nextBtn.addEventListener('click', function(){ goTo(current + 1); });

    // Sync on scroll end (native smooth scroll + snap handles inertia)
    var scrollTimer;
    track.addEventListener('scroll', function(){
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(syncFromScroll, 150);
    }, { passive: true });

    // Update on resize
    window.addEventListener('resize', function(){
      recalcPerPage();
      if(current > maxPage) goTo(maxPage);
      updateUI();
    });

    // Init
    recalcPerPage();
    updateUI();
  })();
})();
</script>
